# Force Gradle + Kotlin to use JDK 17 (PATH may prefer Java 24, which breaks the Kotlin daemon).
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# Reasonable memory (avoid huge metaspace that stresses the daemon).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Avoid flaky Kotlin compile daemon (NoClassDefFoundError / K2JVMCompiler not found).
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx2G,-XX:-UseParallelGC

# Prevent "daemon has been stopped: stop command received" from concurrent builds/IDE.
org.gradle.daemon=false
org.gradle.parallel=false

android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36
